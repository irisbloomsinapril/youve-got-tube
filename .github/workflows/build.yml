name: Build desktop apps
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: python -m PyInstaller --noconfirm YGT.spec
      - if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/YGT.app YGT-macos.zip
      - if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/YGT -DestinationPath YGT-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: YGT-${{ matrix.os }}
          path: YGT-*.zip
